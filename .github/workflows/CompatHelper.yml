name: CompatHelper

on:
  push:
    branches: [main]      # ensures GITHUB_TOKEN is available on pushes
  schedule:
    - cron: '0 0 * * *'    # daily at midnight UTC
  workflow_dispatch:      # allow manual runs

# Global permissions (will be overridden/ensured in job)
permissions:
  contents: write        # allow creating/updating registry files
  pull-requests: write   # allow creating PRs

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check if Julia is already available in the PATH
        id: julia_in_path
        run: |
          if ! command -v julia &> /dev/null; then
            echo "Julia not found"
            exit 1
          fi
        continue-on-error: true

      - name: Install Julia (if missing)
        uses: julia-actions/setup-julia@v2
        if: steps.julia_in_path.outcome != 'success'
        with:
          version: '1'
          arch: ${{ runner.arch }}

      - name: Add the General registry via Git
        run: |
          import Pkg
          ENV["JULIA_PKG_SERVER"] = ""
          Pkg.Registry.add("General")
        shell: julia --color=yes {0}

      - name: Install CompatHelper
        run: |
          import Pkg
          name = "CompatHelper"
          uuid = "aa819f21-2bde-4658-8897-bab36330d9b7"
          version = "3"
          Pkg.add(; name, uuid, version)
        shell: julia --color=yes {0}

      - name: Validate GITHUB_TOKEN
        run: |
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "❌ GITHUB_TOKEN is missing!"
            exit 1
          else
            echo "✅ GITHUB_TOKEN is present."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CompatHelper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If you prefer using a PAT, uncomment and adjust:
          # GITHUB_TOKEN: ${{ secrets.COMPATHELPER_TOKEN }}
          # COMPATHELPER_PRIV: ${{ secrets.COMPATHELPER_PRIV }}
        run: |
          import CompatHelper
          CompatHelper.main()
        shell: julia --color=yes {0}
